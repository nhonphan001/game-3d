<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị nhân vật</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { overflow: auto; height: auto; }
    main { max-width: 760px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1.5px solid var(--ink); overflow-wrap: anywhere; }
    select { font: inherit; color: var(--ink); padding: 8px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    #issued { background: #fff; border: 2.5px dashed var(--ink); border-radius: 12px; padding: 10px 14px; }
    #issued b { font-size: 26px; letter-spacing: 3px; user-select: all; }
  </style>
</head>
<body>
<main>
  <h1>Quản trị nhân vật</h1>
  <form id="loginForm" class="row" style="grid-template-columns: 1fr auto">
    <label>Mã quản trị <input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN trong /etc/lop-hoc.env trên VPS"></label>
    <button class="primary" type="submit">Mở</button>
  </form>
  <p id="err" class="err" role="alert"></p>
  <section id="panel" hidden>
    <h2>Gán nhân vật cho một tên</h2>
    <form id="addForm" class="row">
      <label>Tên đăng nhập <input id="name" type="text" maxlength="20" placeholder="VD: Như Ý"></label>
      <label>Nhân vật <select id="char"></select></label>
      <label>Mã bảo mật <input id="code" type="text" maxlength="32" placeholder="Để trống = tự tạo 6 số"></label>
      <button class="primary" type="submit">Gán</button>
    </form>
    <p class="note">Gán lại cùng một tên sẽ thay nhân vật và mã cũ. Mã chỉ hiện một lần ngay sau khi gán, máy chủ không lưu mã gốc.</p>
    <div id="issued" hidden></div>
    <h2>Tài khoản đã gán</h2>
    <table><thead><tr><th>Tên</th><th>Nhân vật</th><th>Ngày gán</th><th></th></tr></thead><tbody id="accounts"></tbody></table>
    <p id="none" class="note">Chưa có tài khoản nào.</p>
    <h2>Nhân vật có trên máy chủ</h2>
    <ul id="chars"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = '';
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({ error: 'Máy chủ trả lời không hợp lệ.' }));
  if (!res.ok) throw new Error(data.error || 'Có lỗi xảy ra.');
  return data;
}
function render(st) {
  $('panel').hidden = false;
  $('char').replaceChildren(...st.characters.map((c) => new Option(`${c.title} (${c.id})`, c.id)));
  $('chars').replaceChildren(...st.characters.map((c) => {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = `nhan-vat.html?id=${encodeURIComponent(c.id)}`; a.target = '_blank'; a.textContent = `${c.title} (${c.id}) – xem thử`;
    li.append(a); return li;
  }));
  $('accounts').replaceChildren(...st.accounts.map((a) => {
    const tr = document.createElement('tr');
    for (const v of [a.name, a.char, a.created || '']) { const td = document.createElement('td'); td.textContent = v; tr.append(td); }
    const td = document.createElement('td'), b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Xoá';
    b.onclick = () => { if (b.dataset.sure) run(() => api('DELETE', `/api/admin/accounts?name=${encodeURIComponent(a.name)}`)); else { b.dataset.sure = 1; b.textContent = 'Bấm lần nữa để xoá'; } };
    td.append(b); tr.append(td); return tr;
  }));
  $('none').hidden = st.accounts.length > 0;
  if (st.issued) {
    $('issued').hidden = false;
    $('issued').replaceChildren(`Đã gán "${st.issued.name}" → ${st.issued.char}. Mã bảo mật: `, Object.assign(document.createElement('b'), { textContent: st.issued.code }), ' (ghi lại ngay, mã không hiện lại)');
  }
}
async function run(fn) { $('err').textContent = ''; try { render(await fn()); } catch (e) { $('err').textContent = e.message; } }
$('loginForm').onsubmit = (e) => { e.preventDefault(); token = $('token').value.trim(); run(() => api('GET', '/api/admin/state')); };
$('addForm').onsubmit = (e) => { e.preventDefault(); run(async () => { const st = await api('POST', '/api/admin/accounts', { name: $('name').value, char: $('char').value, code: $('code').value }); $('name').value = $('code').value = ''; return st; }); };
</script>
</body>
</html>
